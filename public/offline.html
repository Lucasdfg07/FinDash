<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - FinDash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            color: #e4e6eb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
            background: rgba(26, 31, 46, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            opacity: 0.8;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        p {
            color: #b0b3b8;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .tips {
            text-align: left;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            margin: 24px 0;
            font-size: 14px;
        }

        .tips h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #5a9cff;
        }

        .tips ul {
            list-style: none;
            padding-left: 0;
        }

        .tips li {
            color: #b0b3b8;
            margin-bottom: 6px;
        }

        .tips li:before {
            content: "✓ ";
            color: #22c55e;
            margin-right: 8px;
        }

        button {
            background: #5a9cff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #6ba3ff;
        }

        .status {
            margin-top: 20px;
            font-size: 12px;
            color: #8a8d93;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="1" />
            <path d="M5 12a7 7 0 1 0 14 0" />
            <path d="M2 12a10 10 0 1 0 20 0" />
            <path d="M12 2v4M12 18v4" />
            <path d="M2 12h4M18 12h4" />
        </svg>

        <h1>You're Offline</h1>
        <p>FinDash is trying to connect to the internet. Check your connection and try again.</p>

        <div class="tips">
            <h3>You can still:</h3>
            <ul>
                <li>View cached transactions</li>
                <li>Check your budget summary</li>
                <li>View previous analytics</li>
            </ul>
        </div>

        <button onclick="location.reload()">Retry Connection</button>

        <div class="status">
            <p>Status: <span id="status">Checking...</span></p>
        </div>
    </div>

    <script>
        function updateStatus() {
            const status = navigator.onLine ? '✓ Connected' : '✗ Offline';
            const color = navigator.onLine ? '#22c55e' : '#ef4444';
            const el = document.getElementById('status');
            el.textContent = status;
            el.style.color = color;
        }

        updateStatus();
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);

        // Auto-reload when back online
        window.addEventListener('online', () => {
            setTimeout(() => location.reload(), 1000);
        });
    </script>
</body>
</html>
